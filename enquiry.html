<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Involved | EcoReach South Africa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>EcoReach South Africa</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Volunteer & Sponsorship Enquiry</h2>
        <form class="form-container">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="type">I want to inquire about:</label>
                <select id="type" name="type">
                    <option value="volunteer">Becoming a Volunteer</option>
                    <option value="sponsor">Corporate Sponsorship</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 EcoReach South Africa. All Rights Reserved.</p>
    </footer>
</body>
</html>
